[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcribe"
version = "0.2.0"
description = "Transcribe local audio/video files or video URLs with faster-whisper, GPU-aware in WSL2."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Joe Laskowski" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "faster-whisper>=1.0",
    "yt-dlp>=2024.1",
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]
diarize = [
    "pyannote.audio>=4",
    "torch",
    "torchaudio",
]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]

[project.scripts]
transcribe = "transcribe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# torch's default PyPI build is CUDA 13, and its cuDNN wheel writes the same files as the
# CUDA 12 cuDNN that ctranslate2 (faster-whisper) needs — mixing them breaks both. Pin torch(audio)
# to the CUDA 12 build so the whole process shares one cuDNN.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
